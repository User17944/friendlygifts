<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frendly Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ И ФОН --- */
        body {
            margin: 0; 
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white; 
            
            /* Наш новый фон с мишками и Пепе */
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            display: flex; 
            justify-content: center;
            min-height: 100vh; 
            box-sizing: border-box;
        }

        /* --- КОНТЕЙНЕР --- */
        .container { 
            width: 100%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        /* --- БАННЕР --- */
        .banner {
            width: 100%; 
            border-radius: 16px;
            /* Полупрозрачный черный фон для читаемости текста */
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(10px);
            height: 120px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            flex-direction: column; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .banner h1 { 
            margin: 0; 
            font-size: 26px; 
            font-weight: 800; 
            z-index: 1; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .banner p { 
            margin: 5px 0 0; 
            font-size: 14px; 
            opacity: 0.9; 
            z-index: 1; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* --- ТЕКСТ ПРИВЕТСТВИЯ --- */
        .welcome { 
            font-size: 14px; 
            line-height: 1.5; 
            margin: 10px 5px; 
            color: #fff; 
            text-align: center; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.8); /* Тень для читаемости на фоне */
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        /* --- КНОПКИ --- */
        .row { 
            display: flex; 
            gap: 8px; 
            width: 100%; 
        }
        .btn {
            background-color: rgba(15, 15, 20, 0.75); /* Темный полупрозрачный */
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255,255,255,0.15); 
            border-radius: 12px;
            padding: 16px 10px; 
            font-size: 15px; 
            font-weight: 600;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            text-align: center; 
            transition: transform 0.1s, background 0.2s;
            flex: 1; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active { 
            background-color: rgba(40, 40, 45, 0.9); 
            transform: scale(0.97); 
        }
        .btn-full { 
            flex: none; 
            width: 100%; 
        }
        
        /* Цвета для конкретных кнопок */
        .btn-stars { color: #ffd700; }
        .btn-premium { color: #da70d6; }
        .btn-nft { color: #00bfff; }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-menu { 
            margin-top: 15px; 
            border-top: 1px solid rgba(255,255,255,0.2); 
            padding-top: 15px; 
        }
        .btn-bottom { 
            background-color: rgba(15, 15, 20, 0.6); 
            border: 1px solid rgba(255,255,255,0.15); 
            font-size: 14px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Красивый баннер -->
        <div class="banner">
            <h1>Frendly Gifts</h1>
            <p>Твой магазин подарков и звёзд</p>
        </div>

        <!-- Приветствие -->
        <div class="welcome">
            ⚡ Здесь вы можете купить Telegram Stars, Premium и NFT за рубли.<br>
            🎁 Приятных покупок!
        </div>

        <!-- Ряд 1: Stars и Premium -->
        <div class="row">
            <button class="btn btn-stars" onclick="buy('stars')">⭐ Stars</button>
            <button class="btn btn-premium" onclick="buy('premium')">💎 Premium</button>
        </div>

        <!-- Ряд 2: NFT -->
        <button class="btn btn-full btn-nft" onclick="buy('nft')">🗂 Покупка и Аренда NFT</button>

        <!-- Нижний ряд: Поддержка и Профиль -->
        <div class="row bottom-menu">
            <button class="btn btn-bottom" onclick="support()">😭 Поддержка ↗</button>
            <button class="btn btn-bottom" onclick="profile()">🐤 Профиль</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        // Делаем шапку ТГ прозрачной/темной
        tg.setHeaderColor('#0d0d12');
        tg.setBackgroundColor('#0d0d12');

        // Функции
        function buy(type) {
            tg.sendData(JSON.stringify({ action: 'buy', item: type }));
            tg.HapticFeedback.impactOccurred('light');
        }

        function support() {
            // Ссылка на ваш аккаунт поддержки (замените на свой юзернейм без @)
            tg.openTelegramLink('https://t.me/@hiouromi');
        }

        function profile() {
            tg.sendData(JSON.stringify({ action: 'profile' }));
            tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
