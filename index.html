<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frendly Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white; background-color: #0d0d12;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255,215,0,0.08), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(138,43,226,0.1), transparent 40%);
            background-attachment: fixed;
            display: flex; justify-content: center;
            min-height: 100vh; box-sizing: border-box;
        }
        .bg-decor { position: fixed; z-index: -1; opacity: 0.15; font-size: 40px; pointer-events: none; }
        .decor-1 { top: 10%; left: 5%; transform: rotate(-15deg); }
        .decor-2 { top: 40%; right: 5%; transform: rotate(20deg); font-size: 60px; }
        .decor-3 { bottom: 20%; left: 10%; transform: rotate(10deg); font-size: 30px; }
        .decor-4 { top: 70%; right: 15%; transform: rotate(-25deg); }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
        .banner {
            width: 100%; border-radius: 16px;
            background: linear-gradient(135deg, #2b1055, #7597de);
            height: 120px; display: flex; align-items: center; justify-content: center;
            flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }
        .banner::after { content: '🎁'; position: absolute; font-size: 100px; opacity: 0.2; right: -20px; bottom: -20px; transform: rotate(15deg); }
        .banner h1 { margin: 0; font-size: 24px; font-weight: 800; z-index: 1; }
        .banner p { margin: 5px 0 0; font-size: 14px; opacity: 0.8; z-index: 1; }
        .welcome { font-size: 14px; line-height: 1.5; margin: 10px 5px; color: #d1d1d6; text-align: center; }
        .row { display: flex; gap: 8px; width: 100%; }
        .btn {
            background-color: rgba(28,28,30,0.8); color: white;
            border: 1px solid rgba(255,255,255,0.05); border-radius: 12px;
            padding: 16px 10px; font-size: 15px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 8px; text-align: center; transition: transform 0.1s, background 0.2s;
            flex: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .btn:active { background-color: rgba(44,44,46,0.9); transform: scale(0.97); }
        .btn-full { flex: none; width: 100%; }
        .btn-stars { color: #ffd700; }
        .btn-premium { color: #da70d6; }
        .btn-nft { color: #00bfff; }
        .bottom-menu { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .btn-bottom { background-color: transparent; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
    </style>
</head>
<body>
    <div class="bg-decor decor-1">🎁</div>
    <div class="bg-decor decor-2">🎈</div>
    <div class="bg-decor decor-3">✨</div>
    <div class="bg-decor decor-4">🎁</div>
    <div class="container">
        <div class="banner">
            <h1>Frendly Gifts</h1>
            <p>Твой магазин подарков и звёзд</p>
        </div>
        <div class="welcome">
            ⚡ Здесь вы можете купить Telegram Stars, Premium и NFT за рубли.<br>
            🎁 Приятных покупок!
        </div>
        <div class="row">
            <button class="btn btn-stars" onclick="buy('stars')">⭐ Stars</button>
            <button class="btn btn-premium" onclick="buy('premium')">💎 Premium</button>
        </div>
        <button class="btn btn-full btn-nft" onclick="buy('nft')">🗂 Покупка и Аренда NFT</button>
        <div class="row bottom-menu">
            <button class="btn btn-bottom" onclick="support()">😭 Поддержка ↗</button>
            <button class="btn btn-bottom" onclick="profile()">🐤 Профиль</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0d0d12');
        tg.setBackgroundColor('#0d0d12');
        function buy(type) {
            tg.sendData(JSON.stringify({ action: 'buy', item: type }));
            tg.HapticFeedback.impactOccurred('light');
        }
        function support() { tg.openTelegramLink('https://t.me/@hiouromi'); }
        function profile() {
            tg.sendData(JSON.stringify({ action: 'profile' }));
            tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
