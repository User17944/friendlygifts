<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frendly Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; 
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white; 
            
            /* Прямая ссылка на нашу картинку */
            background-image: url('https://user17944.github.io/friendlygifts/bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            display: flex; 
            justify-content: center;
            min-height: 100vh; 
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-top: 150px; /* Опускаем кнопки вниз, чтобы не закрывать Пепе */
        }

        /* Приветственный текст на полупрозрачном фоне */
        .welcome { 
            font-size: 14px; 
            line-height: 1.5; 
            margin: 10px 5px; 
            color: #fff; 
            text-align: center; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.8); 
            background: rgba(0, 0, 0, 0.6); /* Темнее для читаемости */
            padding: 12px; 
            border-radius: 12px; 
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .row { display: flex; gap: 8px; width: 100%; }
        
        .btn {
            background-color: rgba(15, 15, 20, 0.85); /* Темные кнопки */
            backdrop-filter: blur(10px);
            color: white; 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 12px;
            padding: 16px 10px; 
            font-size: 15px; 
            font-weight: 600;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            text-align: center; 
            transition: transform 0.1s, background 0.2s;
            flex: 1; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn:active { background-color: rgba(50, 50, 55, 0.95); transform: scale(0.97); }
        .btn-full { flex: none; width: 100%; }
        
        .btn-stars { color: #ffd700; }
        .btn-premium { color: #da70d6; }
        .btn-nft { color: #00bfff; }

        .bottom-menu { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
        .btn-bottom { background-color: rgba(15, 15, 20, 0.7); border: 1px solid rgba(255,255,255,0.15); font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Текст приветствия -->
        <div class="welcome">
            ⚡ Здесь вы можете купить Telegram Stars, Premium и NFT за рубли.<br>
            🎁 Приятных покупок!
        </div>

        <div class="row">
            <button class="btn btn-stars" onclick="buy('stars')">⭐ Stars</button>
            <button class="btn btn-premium" onclick="buy('premium')">💎 Premium</button>
        </div>

        <button class="btn btn-full btn-nft" onclick="buy('nft')">🗂 Покупка и Аренда NFT</button>

        <div class="row bottom-menu">
            <button class="btn btn-bottom" onclick="support()">😭 Поддержка ↗</button>
            <button class="btn btn-bottom" onclick="profile()">🐤 Профиль</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#0d0d12');
        tg.setBackgroundColor('#0d0d12');

        function buy(type) {
            tg.sendData(JSON.stringify({ action: 'buy', item: type }));
            tg.HapticFeedback.impactOccurred('light');
        }

        function support() {
            tg.openTelegramLink('https://t.me/hiouromi');
        }

        function profile() {
            tg.sendData(JSON.stringify({ action: 'profile' }));
            tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
